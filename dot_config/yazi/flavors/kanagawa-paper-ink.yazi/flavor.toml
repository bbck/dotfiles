#:schema https://yazi-rs.github.io/schemas/theme.json

# Kanagawa Paper Ink, forked from https://github.com/melindachang/kanagawa-paper.yazi
#
# Palette: https://github.com/thesimonho/kanagawa-paper.nvim
# sumiInk0       "#16161d"
# sumiInk3       "#1f1f28" bg
# sumiInk4       "#2a2a37" bg_p1
# sumiInk5       "#363646" bg_p2
# sumiInk6       "#54546d" bg_p3
# dragonBlack5   "#393836" fg_dim
# fujiGray       "#727169"
# dragonGray2    "#9e9b93" fg_gray
# fujiWhite      "#dcd7ba" fg
# dragonRed      "#c4746e"
# dragonOrange   "#b6927b"
# dragonYellow   "#c4b28a"
# dragonGreen    "#699469"
# dragonAqua     "#8ea49e"
# dragonBlue     "#658594"
# dragonBlue2    "#859fac"
# dragonViolet   "#8992a7"
# dragonPink     "#a292a3"
# springViolet1  "#938aa9"

[mgr]
cwd = { fg = "#dcd7ba", bold = true }

# Find
find_keyword = { fg = "#1d1c19", bg = "#938aa9", bold = true }  # Search
find_position = { fg = "#9e9b93", bold = true, italic = true }

# Marker
marker_copied = { fg = "#699469", bg = "#699469" }
marker_cut = { fg = "#c4746e", bg = "#c4746e" }
marker_marked = { fg = "#938aa9", bg = "#938aa9" }  # Visual
marker_selected = { fg = "#a292a3", bg = "#a292a3" }  # SnacksPickerSelected

# Count
count_copied = { fg = "#699469", bold = true, reversed = true }
count_cut = { fg = "#c4746e", bold = true, reversed = true }
count_selected = { fg = "#a292a3", bold = true, reversed = true }

# Border
border_symbol = "│"
border_style = { fg = "#8992a7" }  # WinSeparator

[indicator]
parent = { bg = "#363646" }
current = { bg = "#363646" }  # SnacksPickerListCursorLine
preview = { bg = "#363646" }
padding = { open = "█", close = "█" }

[tabs]
active = { fg = "#a292a3", bg = "#363646", bold = true }
inactive = { fg = "#9e9b93", bg = "#2a2a37" }
sep_inner = { open = "", close = "" }
sep_outer = { open = "", close = "" }

# lualine-kanagawa-paper-ink: a/z = main, b/y = alt, c/x = status.overall
[mode]
normal_main = { fg = "#16161d", bg = "#c4b28a" }
normal_alt = { fg = "#c4b28a", bg = "#363646" }
select_main = { fg = "#1f1f28", bg = "#938aa9" }
select_alt = { fg = "#938aa9", bg = "#363646" }
unset_main = { fg = "#1f1f28", bg = "#c4746e" }
unset_alt = { fg = "#c4746e", bg = "#363646" }

[status]
overall = { fg = "#9e9b93", bg = "#2a2a37" }
sep_left = { open = "", close = "" }
sep_right = { open = "", close = "" }

# Permissions
perm_type = { fg = "#658594" }
perm_read = { fg = "#c4b28a" }
perm_write = { fg = "#c4746e" }
perm_exec = { fg = "#699469" }
perm_sep = { fg = "#9e9b93" }

# Progress
progress_label = { fg = "#1f1f28" }
progress_normal = { fg = "#658594", bg = "#859fac" }
progress_error = { bg = "#c4746e" }

[which]
border = { fg = "#54546d" }
cols = 3
mask = { bg = "#2a2a37" }
cand = { fg = "#c4746e" }  # WhichKey
rest = { fg = "#c4b28a", italic = true }
desc = { fg = "#9e9b93" }
separator = " ➜ "
separator_style = { fg = "#727169" }

[confirm]
border = { fg = "#54546d" }
title = { fg = "#9e9b93", bold = true }
body = { fg = "#dcd7ba", bold = true }
list = { fg = "#dcd7ba" }
btn_yes = { fg = "#dcd7ba", bg = "#363646", bold = true }
btn_no = { fg = "#9e9b93", bg = "#2a2a37" }

[spot]
border = { fg = "#54546d" }
title = { fg = "#9e9b93", bold = true }
tbl_col = { fg = "#9e9b93" }
tbl_cell = { bg = "#2a2a37" }

[notify]
title_info = { fg = "#658594" }
title_warn = { fg = "#c4b28a" }
title_error = { fg = "#c4746e" }

[pick]
border = { fg = "#54546d" }
active = { fg = "#dcd7ba", bg = "#363646" }
inactive = { fg = "#9e9b93" }

[input]
border = { fg = "#54546d" }
title = { fg = "#9e9b93", bold = true }
value = { fg = "#dcd7ba" }
selected = { bg = "#363646" }

[cmp]
border = { fg = "#54546d" }
active = { bg = "#363646" }  # PmenuSel
inactive = { fg = "#9e9b93" }

[tasks]
border = { fg = "#54546d" }
title = { fg = "#9e9b93", bold = true }
hovered = { bg = "#363646" }

[help]
border = { fg = "#54546d" }
chord = { fg = "#c4746e" }
action = { fg = "#9e9b93" }
hovered = { bg = "#363646" }

[filetype]
rules = [
  { mime = "image/*", fg = "#938aa9" },
  { mime = "{audio,video}/*", fg = "#c4b28a" },
  { url = "*", is = "exec", fg = "#699469" },
  { url = "*", is = "orphan", fg = "#9e9b93", crossed = true },
  { url = "*/", is = "orphan", fg = "#9e9b93", crossed = true },
  { url = "*", is = "link", fg = "#8ea49e" },
  { url = "*/", is = "link", fg = "#8ea49e" },
  { url = "*", is = "hidden", fg = "#9e9b93" },
  { url = "*/", is = "hidden", fg = "#9e9b93" },
  { url = "*", is = "dummy", bg = "#c4746e" },
  { url = "*/", is = "dummy", bg = "#c4746e" },
  { url = "*", fg = "#dcd7ba" },
  { url = "*/", fg = "#859fac" },  # Directory
]

# Generated from mini.icons with the kanagawa-paper-ink colorscheme. These replace
# yazi's icon lists, so files mini.icons doesn't know get the generic icon
[icon]
globs = []
conds = [
  # Special files
  { if = "orphan", text = "", fg = "#9e9b93" },
  { if = "link", text = "", fg = "#8ea49e" },
  { if = "block", text = "", fg = "#c4b28a" },
  { if = "char", text = "", fg = "#c4b28a" },
  { if = "fifo", text = "", fg = "#c4b28a" },
  { if = "sock", text = "", fg = "#c4b28a" },
  { if = "sticky", text = "", fg = "#c4b28a" },
  { if = "dummy", text = "", fg = "#c4746e" },

  # Fallback, same as mini.icons defaults
  { if = "dir", text = "󰉋", fg = "#c4b28a" },
  { if = "exec", text = "", fg = "#699469" },
  { if = "!dir", text = "󰈔", fg = "#dcd7ba" },
]

