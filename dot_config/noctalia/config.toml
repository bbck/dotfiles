[theme]
community_palette = "Kanagawa Paper"
source = "community"

[theme.templates]
builtin_ids = ["gtk3", "gtk4"]

[wallpaper.default]
path = "/home/chris/Pictures/Wallpapers/lamp-post.jpg"

[bar.main]
start = ["launcher"]
center = ["clock"]
end = ["tray", "notifications", "network", "volume", "session"]
margin_ends = 860

[bar.main.monitor.DP-4]
enabled = false

[idle]
behavior_order = ["lock", "screen-off", "suspend"]

[idle.behavior.lock]
action = "lock"
timeout = 900  # 15 min

[idle.behavior.screen-off]
action = "screen_off"
timeout = 1800  # 30 min

[idle.behavior.suspend]
action = "lock_and_suspend"
timeout = 3600  # 60 min

[lockscreen]
monitors = ["DP-1"]
tint_intensity = 0.3

# TODO: lockscreen widgets

[notification]
monitors = ["DP-1"]

[shell]
launch_apps_custom_command = "uwsm-app -- $CMD"

[shell.launcher.providers.calculator]
global = false

[weather]
unit = "imperial"

[widget.network]
show_label = false

[widget.tray]
drawer = true
